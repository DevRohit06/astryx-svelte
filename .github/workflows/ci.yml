name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch is wasted compute — and this workflow is
# expensive. Never cancel on `main`, where each run is the record for a commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which parts of the repo changed. `changed-scopes.mjs` is deny-by-default: a
  # path it does not recognise sets `global`, and every job runs. See its header.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      core: ${{ steps.scopes.outputs.core }}
      cli: ${{ steps.scopes.outputs.cli }}
      themes: ${{ steps.scopes.outputs.themes }}
      docs: ${{ steps.scopes.outputs.docs }}
      global: ${{ steps.scopes.outputs.global }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Both SHAs have to be reachable to diff them.
          fetch-depth: 0
      - id: scopes
        run: node .github/scripts/changed-scopes.mjs
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  # `pnpm verify --no-client` — build, typecheck, lint, core's server project
  # plus both fidelity oracles, every other package's tests, and the
  # full-tier status generation, gated against the committed `port/status.md`.
  # It runs every stage rather than stopping at the first red one, which a
  # plain sequence of job steps cannot do — a failing step here would
  # otherwise skip the rest and hide whatever they'd have reported.
  #
  # `--no-client` is the load-bearing choice here. An earlier version of this
  # workflow ran plain `pnpm verify`, which folded this job and the
  # browser-only `client` job into one — `pnpm verify`'s test stage was `pnpm
  # -r test`, and running the browser suite again in a second job would just
  # be the same ~4,500 cases twice. That merge serialised roughly 13 minutes
  # of work (409 s of tests, 190 s of lint, 76 s build, 51 s typecheck, 33 s
  # demo build, 21 s Playwright download) into every PR that touched core or
  # a theme — the common case — where two `needs: changes`-gated jobs used to
  # run concurrently. `--no-client` restores that: this job runs everything
  # *except* the browser suite, `client` below runs *only* the browser suite,
  # and they run in parallel again. The trade-off traded away by that earlier
  # merge — a CLI-only change paying for the browser suite it doesn't need —
  # is fixed too: this job's condition (core/cli/themes/global) still covers
  # `cli`, but `client`'s below does not, exactly as it didn't before the
  # merge.
  #
  # Playwright is still installed here even though this job never runs the
  # browser suite: `status.mjs --full`'s "Test collection" stage lists every
  # vitest project, client included, and Vitest's browser mode needs a real
  # browser to collect from, not just to run.
  lib:
    needs: changes
    if: needs.changes.outputs.global == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.themes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          # Root `engines` asks for >=22. Kept unpinned within the major so a
          # patch bump doesn't need a commit here.
          node-version: 22
          cache: pnpm

      # Deliberately a full install — no --prod, no NODE_ENV=production.
      # Both fidelity oracles read the upstream Astryx packages, which are
      # devDependencies; pruning them turns the checks into no-ops that still
      # report green. Each oracle now fails loudly if its upstream is missing,
      # so a regression here is caught rather than silently tolerated.
      - run: pnpm install --frozen-lockfile

      # `status.mjs`'s Surface section diffs `packages/core/src/lib/components`
      # against upstream's own source tree at `reference/astryx-upstream/` (see
      # its header comment) — gitignored, so no checkout brings it along.
      # Without it, `status.mjs` prints "upstream clone absent" and drops the
      # "Missing here"/"Not in upstream" rows entirely, which is a *different*
      # `port/status.md` than the one a contributor generates locally with the
      # clone present — the drift gate below would then fail on every run.
      # Pinned to the tag matching `@astryxdesign/core`'s devDependency version
      # rather than hardcoded, so this step tracks `track-upstream` bumps
      # automatically instead of silently drifting the way the file it guards
      # once did.
      - name: Clone upstream Astryx (status.mjs diffs against its source tree)
        run: |
          pin=$(node -p "require('./packages/core/package.json').devDependencies['@astryxdesign/core']")
          git clone --depth 1 --branch "v$pin" https://github.com/facebook/astryx.git reference/astryx-upstream
          # The same rename CLAUDE.md requires of a developer, for the same
          # reason and now for a second one: upstream tracks its own CLAUDE.md,
          # so every fresh clone restores it, and `status.mjs` fails the gate
          # while it is there. Renaming here keeps that check universal instead
          # of excusing the one environment that clones on every run.
          mv -f reference/astryx-upstream/CLAUDE.md reference/astryx-upstream/UPSTREAM-CLAUDE.md

      # See the job comment: needed for status.mjs's test-collection stage,
      # not for running the browser suite itself.
      - name: Install the browser the client test project needs
        run: pnpm -F @astryx-svelte/core exec playwright install --with-deps chromium

      - name: Verify
        run: pnpm verify --no-client --no-docs

      # The same manifest gate the release runs, minus the version pin: publint
      # over every publishable package, plus the README check that caught all
      # eight theme packages shipping an empty npm page. Here rather than only
      # at release time, because a manifest that stops resolving is cheap to
      # catch on the PR that breaks it and expensive to discover mid-publish.
      - name: Every package is still fit to publish
        run: node scripts/check-publish.mjs

  # The browser suite, alone: 163 files and ~4,500 cases in real headless
  # Chromium, and by far the longest thing here. Runs in parallel with `lib`
  # rather than after it, so a docs-only or CLI-only change does not pay for
  # it at all — see the trade-off note on `lib` above. `status.mjs` and the
  # `port/status.md` drift gate live entirely in `lib`, so they run exactly
  # once across the workflow; this job reports test results only.
  client:
    needs: changes
    if: needs.changes.outputs.global == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.themes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The client vitest project runs in a real headless Chromium through
      # Playwright, and `pnpm install` does not fetch browser binaries — they
      # live in ~/.cache/ms-playwright, outside node_modules. Without this the
      # whole project fails to launch with "Executable doesn't exist", which is
      # how it went unrun in CI for its entire life: Typecheck was failing
      # first, so the Test step never got the chance to say so.
      - name: Install the browser the client test project needs
        run: pnpm -F @astryx-svelte/core exec playwright install --with-deps chromium

      # Built for the same reason `lib` builds: the suite imports through `$lib`,
      # but `svelte-kit sync` and the theme packages it touches expect the
      # topological build to have run.
      - name: Build
        run: pnpm -r build

      - name: Client test project
        run: pnpm -F @astryx-svelte/core test:client

  # The docs site. Runs on its own changes *and* on core's, because the
  # dependency is one-directional: `docs/vite.config.ts` compiles core's StyleX
  # itself and `docs/scripts/generate-content.mjs` reads prop types out of
  # `packages/core/dist/`. Core never depends on docs.
  docs:
    needs: changes
    if: needs.changes.outputs.global == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The docs content pipeline reads `.doc.mjs` out of the upstream
      # `@astryxdesign/*` packages and prop *types* out of core's `dist/`, so the
      # build is a prerequisite here exactly as it is in `lib`.
      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -F docs check

      - name: Lint
        run: pnpm -F docs lint

      - name: Docs content is current
        run: pnpm -F docs test

  # One always-running check to hang branch protection off, so a skipped job
  # cannot leave a required status pending forever. `needs` results are
  # `success` / `failure` / `cancelled` / `skipped`; skipped is a pass here,
  # because it means the filter decided the job was irrelevant to this diff.
  ci:
    if: always()
    needs: [changes, lib, client, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Every required job passed or was skipped
        run: |
          echo '${{ toJSON(needs) }}'
          echo '${{ toJSON(needs) }}' | node -e "
            const needs = JSON.parse(require('node:fs').readFileSync(0, 'utf8'));
            const bad = Object.entries(needs).filter(
              ([, v]) => v.result !== 'success' && v.result !== 'skipped'
            );
            if (bad.length) {
              console.error('failed: ' + bad.map(([k, v]) => k + '=' + v.result).join(', '));
              process.exit(1);
            }
            console.log('all good: ' + Object.entries(needs).map(([k, v]) => k + '=' + v.result).join(', '));
          "
